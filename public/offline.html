<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hors-ligne - Legba Note</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #0a0f1d 0%, #132F4C 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .container {
      max-width: 500px;
      text-align: center;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 32px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .icon svg {
      width: 60px;
      height: 60px;
      color: #00ffff;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #00ffff 0%, #FFD700 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 32px;
    }

    .info-box {
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 32px;
      text-align: left;
    }

    .info-box h3 {
      font-size: 14px;
      font-weight: 600;
      color: #FFD700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info-box ul {
      list-style: none;
      padding: 0;
    }

    .info-box li {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      padding: 6px 0;
      padding-left: 20px;
      position: relative;
    }

    .info-box li:before {
      content: "✓";
      position: absolute;
      left: 0;
      color: #00ffff;
      font-weight: bold;
    }

    button {
      background: linear-gradient(135deg, rgba(0, 255, 255, 0.2) 0%, rgba(0, 255, 255, 0.1) 100%);
      border: 1px solid rgba(0, 255, 255, 0.3);
      color: white;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    button:hover {
      background: linear-gradient(135deg, rgba(0, 255, 255, 0.3) 0%, rgba(0, 255, 255, 0.2) 100%);
      border-color: rgba(0, 255, 255, 0.5);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .ambient {
      position: fixed;
      pointer-events: none;
      z-index: -1;
    }

    .ambient-1 {
      top: -20%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 255, 255, 0.05) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(100px);
    }

    .ambient-2 {
      bottom: -20%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.05) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(120px);
    }
  </style>
</head>
<body>
  <div class="ambient ambient-1"></div>
  <div class="ambient ambient-2"></div>

  <div class="container">
    <div class="icon">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414"/>
      </svg>
    </div>

    <h1>Vous êtes hors-ligne</h1>
    <p>Legba Note nécessite une connexion internet pour accéder à l'API Gemini et générer des réponses vocales.</p>

    <div class="info-box">
      <h3>
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
        </svg>
        Fonctionne hors-ligne
      </h3>
      <ul>
        <li>Consultation de vos cours importés</li>
        <li>Navigation dans l'interface</li>
        <li>Accès à l'historique local</li>
        <li>Configuration des paramètres vocaux</li>
      </ul>
    </div>

    <button onclick="window.location.reload()">
      🔄 Réessayer la connexion
    </button>
  </div>

  <script>
    // Vérifier périodiquement si la connexion est rétablie
    let checkInterval;

    function checkConnection() {
      if (navigator.onLine) {
        console.log('[Offline] Connexion rétablie');
        clearInterval(checkInterval);
        window.location.href = '/';
      }
    }

    // Démarrer la vérification
    checkInterval = setInterval(checkConnection, 5000);

    // Nettoyer lors du départ
    window.addEventListener('beforeunload', () => {
      clearInterval(checkInterval);
    });

    // Écouter les événements de connexion
    window.addEventListener('online', () => {
      console.log('[Offline] Événement online détecté');
      window.location.href = '/';
    });
  </script>
</body>
</html>
